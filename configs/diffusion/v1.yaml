# v1: branched from v1_ortho for the new ca_squared_2m dataset. Conditions on all
# four orthotropic (D2) stiffness params + vol -> 5-dim condition
# (C11, C22, C12, C66, vol). Uses the scalers fit on the new dataset
# (dataset/scalers, via dataset.cellular_chiral.fit_scalers) and TENSOR_DIM=5.

# data
h5_path: output/ca_squared_2m/stiffness.h5
scaler_dir: dataset/scalers
split_path: dataset/splits/split_v1.json
val_frac: 0.05
split_seed: 777

# IO
results_folder: output/diffusion_ca_squared
name: v1
seed: 777
save_every_epoch: 5
save_last: true
continue_training: false

# model
image_size: 64
base_channels: 128
attention_resolutions: "8,4"
with_attention: true
num_heads: 4
dropout: 0.1
use_tensor_condition: true
noise_schedule: cosine

# training
batch_size: 256
lr: 1.0e-4
lr_schedule: cosine
optimizer_name: adam
ema_rate: 0.9999
training_epoch: 200
gradient_clip_val: 1.0
num_workers: 7
precision: "32-true"

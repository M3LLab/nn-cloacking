# v4: train on the compressed 25x25 NW mirror-quadrant; full 50x50 cell is
# recovered deterministically at inference via unfold_mirror (the inverse of
# generator._assemble_squared). 6x cheaper per forward pass than v3, shallower
# unet (3 down steps: 25 -> 13 -> 7 -> 4), still attention at H=4.

# data
h5_path: output/ca_bulk_squared/stiffness.h5
scaler_dir: microstructure_generation_2d
split_path: microstructure_generation_2d/split_v3.json  # reuse v3 indices for direct val comparison
val_frac: 0.05
split_seed: 777

# IO
results_folder: output/diffusion_ca_squared
name: v4
seed: 777
save_every_epoch: 5
save_last: true
continue_training: false

# model
compressed: true
image_size: 25
dim_mults: [1, 2, 4, 8]
attention_sizes: [4]
base_channels: 128
with_attention: true
num_heads: 4
dropout: 0.1
use_tensor_condition: true
noise_schedule: cosine

# training
batch_size: 64
lr: 1.0e-4
lr_schedule: cosine
optimizer_name: adam
ema_rate: 0.9999
training_epoch: 200
gradient_clip_val: 1.0
num_workers: 4
precision: "32-true"

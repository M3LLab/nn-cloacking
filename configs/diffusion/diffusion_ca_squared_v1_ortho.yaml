# v5_ortho: branched from v3. Conditions on all four orthotropic (D2) stiffness
# params + vol -> 5-dim condition (C11, C22, C12, C66, vol). Requires scaler_C22
# (run dataset.cellular_chiral.fit_scalers) and TENSOR_DIM=5 in the network.

# data
h5_path: output/ca_bulk_squared/stiffness.h5
scaler_dir: microstructure_generation_2d
split_path: microstructure_generation_2d/split_v3.json
val_frac: 0.05
split_seed: 777

# IO
results_folder: output/diffusion_ca_squared
name: v1_ortho
seed: 777
save_every_epoch: 5
save_last: true
continue_training: false

# model
image_size: 64
base_channels: 128
attention_resolutions: "8,4"
with_attention: true
num_heads: 4
dropout: 0.1
use_tensor_condition: true
noise_schedule: cosine

# training
batch_size: 256
lr: 1.0e-4
lr_schedule: cosine
optimizer_name: adam
ema_rate: 0.9999
training_epoch: 200
gradient_clip_val: 1.0
num_workers: 4
precision: "32-true"
